name: Shokin downstream release

on:
  push:
    branches:
      - shokin-v1.1.9
    paths:
      - "moli-layout/src/form.rs"
      - ".github/workflows/shokin-release.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RELEASE_TAG: v1.1.9-shokin.1

jobs:
  build-linux:
    name: Build Linux x86_64
    runs-on: ubuntu-latest
    timeout-minutes: 90
    container: rust:1.96.1-bookworm
    steps:
      - name: Checkout downstream branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install build dependencies
        shell: bash
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends binutils cmake libclang-dev python3
          rm -rf /var/lib/apt/lists/*

      - name: Verify downstream password mask
        shell: bash
        run: |
          set -euo pipefail
          grep -F '"•".repeat(data.value.chars().count())' moli-layout/src/form.rs

      - name: Build and package Moli 1.1.9
        shell: bash
        run: >-
          python3 scripts/release.py
          --version 1.1.9
          --expected-target x86_64-unknown-linux-gnu

      - name: Write checksum
        shell: bash
        run: |
          cd dist
          sha256sum moli-x86_64-unknown-linux-gnu.tar.gz > moli-x86_64-unknown-linux-gnu.tar.gz.sha256

      - name: Upload release payload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: shokin-moli-linux-x86_64
          path: |
            dist/moli-x86_64-unknown-linux-gnu.tar.gz
            dist/moli-x86_64-unknown-linux-gnu.tar.gz.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    name: Publish downstream release
    needs: build-linux
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download release payload
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: shokin-moli-linux-x86_64
          path: dist

      - name: Create or refresh GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Moli 1.1.9 Shokin downstream 1" \
              --prerelease \
              --notes "Downstream build of Moli v1.1.9 with password-field visual masking for BrowserAuth. The real input value remains in DOM/form state; screenshots and screencasts render bullets instead."
          fi
